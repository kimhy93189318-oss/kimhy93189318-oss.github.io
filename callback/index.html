<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tesla 인증 코드</title></head>
<body style="font-family:sans-serif;padding:24px">
<h2>인증 코드</h2><p>아래 코드를 복사해서 채팅에 붙여넣어 주세요.</p>
<textarea id="c" style="width:100%;height:120px;font-size:16px" readonly></textarea>
<script>var p=new URLSearchParams(location.search);document.getElementById('c').value=p.get('code')||('오류: '+(p.get('error')||'코드 없음'));</script>
</body></html>
